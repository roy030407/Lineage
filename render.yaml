services:
  - type: web
    name: lineage-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is injected by Render at runtime -- never hardcode a port here.
    # --proxy-headers/--forwarded-allow-ips: Render terminates TLS in front
    # of the app and proxies plain HTTP to it, so the app never sees the
    # request directly; this is the standard, low-risk uvicorn setting for
    # running behind a reverse proxy (nothing in this app currently inspects
    # scheme/client-IP, but this is correct if that ever changes).
    # --workers 1 is not the uvicorn default in every context and is
    # deliberately explicit, not a no-op: AppState (api/deps.py) is a bare
    # process-wide Python global, and the tick loop only advances state on
    # whatever process has an engine loaded. A second worker would get its
    # own empty copy of everything -- if the live WebSocket connection
    # landed there while 'load' landed on the first, it would sit forever
    # showing whatever the first tick was, never advancing. Do not raise
    # this without first moving state out of an in-process global.
    startCommand: >-
      uvicorn lineage.api.app:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --proxy-headers
      --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ALLOWED_ORIGIN
        # sync: false -- Render will prompt for this in the dashboard rather
        # than storing a value in this file. Set it to the real Vercel
        # deployment URL once that exists, e.g. https://lineage.vercel.app
        # (comma-separate for more than one, e.g. a preview deployment
        # alongside production). The app falls back to
        # http://localhost:5173 (local dev only) if this is ever unset.
        sync: false
      - key: LINEAGE_API_KEY
        # sync: false for the same reason as ALLOWED_ORIGIN: Render prompts
        # for it rather than storing a secret in this file.
        #
        # Leaving it unset is a deliberate, working configuration: the
        # gate in api/security.py is inert without it, which is what local
        # development and the whole test suite rely on. Setting it makes
        # every write (builder edits, replay control, simulate, act
        # approvals) and the ~105s prediction-ledger reads require an
        # X-Lineage-Key header. Reads and the WebSocket stay public either
        # way, so the Mirror still works for an anonymous viewer.
        #
        # Do NOT mirror this into a VITE_ variable on the frontend:
        # anything compiled into that bundle is readable in devtools,
        # which makes it obfuscation rather than a credential. The
        # frontend prompts an operator for it and holds it in
        # sessionStorage.
        sync: false
